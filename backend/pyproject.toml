[tool.poetry]
name = "elmerfem-backend"
version = "0.1.0"
description = "Backend API for ElmerFEM Educational Platform"
authors = ["ElmerFEM Educational Platform Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.110.*"
uvicorn = {extras = ["standard"], version = "0.27.*"}
pydantic = "2.*"
pydantic-settings = "^2.0.0"
jinja2 = "3.*"
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"
redis = "^5.0.0"
aioredis = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.*"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"
black = "^24.0.0"
ruff = "^0.3.0"
isort = "^5.13.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 